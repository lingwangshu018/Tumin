name: Patch Generation Tool Surface
on:
  push:
    paths:
      - '.github/generation-tool-surface-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GenerationHandler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt')
          s=p.read_text(encoding='utf-8-sig')
          marker='private const val STREAM_UI_THROTTLE_MS = 50L\n'
          assert marker in s
          addition='''private const val STREAM_UI_THROTTLE_MS = 50L\n\nprivate val COMPANION_HARD_ROUTE_TOOL_NAMES = setOf(\n    "read_couple_space",\n    "post_couple_space",\n    "comment_couple_space",\n    "delete_couple_space_post",\n    "shared_diary",\n    "anniversary_book",\n    "life_memo",\n    "life_calendar",\n    "shared_reading",\n    "shared_music",\n)\n'''
          s=s.replace(marker,addition,1)
          old='''        var messages: List<UIMessage> = messages\n\n        for (stepIndex in 0 until maxSteps) {'''
          new='''        var messages: List<UIMessage> = messages\n            .map { message ->\n                message.copy(\n                    parts = message.parts.filterNot { part ->\n                        part is UIMessagePart.Tool && part.toolName.isBlank()\n                    }\n                )\n            }\n            .filterNot { it.parts.isEmpty() }\n\n        val companionHardRoute = tools.isNotEmpty() && tools.all { it.name in COMPANION_HARD_ROUTE_TOOL_NAMES }\n\n        for (stepIndex in 0 until maxSteps) {'''
          assert old in s
          s=s.replace(old,new,1)
          old='''            val toolsInternal = buildList {\n                Log.i(TAG, "generateInternal: build tools($assistant)")\n                if (assistant?.enableMemory == true) {'''
          new='''            val toolsInternal = buildList {\n                Log.i(TAG, "generateInternal: build tools($assistant), companionHardRoute=$companionHardRoute")\n                if (!companionHardRoute && assistant.enableMemory) {'''
          assert old in s
          s=s.replace(old,new,1)
          old='''                // 文件写入工具 - AI可直接将文件内容写入设备或打包ZIP\n                add(buildWriteFilesTool(conversationId))\n                addAll(tools)\n            }'''
          new='''                // 文件写入工具不应污染生活模块的 Hard Route。\n                if (!companionHardRoute) {\n                    add(buildWriteFilesTool(conversationId))\n                }\n                addAll(tools)\n            }.distinctBy { it.name }'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          git commit -m 'fix: repair final provider tool surface and invalid tool history'
          git push