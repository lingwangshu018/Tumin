name: Prepare 3.0.3 Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/prepare-3.0.3-release.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Bump version and trigger release
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 171', 'versionCode = 172', 1)
          s = s.replace('versionName = "3.0.2"', 'versionName = "3.0.3"', 1)
          p.write_text(s)
          Path('.github/build-trigger').write_text('release 3.0.3\n')
          Path('.github/workflows/prepare-3.0.3-release.yml').unlink()
          PY
      - name: Commit release bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release 3.0.3"
          git push origin HEAD:master
