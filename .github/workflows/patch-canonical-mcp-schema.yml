name: Patch canonical MCP schema
on:
  push:
    branches: [perf/canonical-mcp-schema]
    paths: [.github/workflows/patch-canonical-mcp-schema.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/canonical-mcp-schema
      - name: Patch McpManager
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpManager.kt')
          s = p.read_text(encoding='utf-8-sig')
          old = '''private fun ToolSchema.toSchema(): InputSchema {
    return InputSchema.Obj(properties = this.properties ?: JsonObject(emptyMap()), required = this.required)
}
'''
          new = '''private fun canonicalizeSchemaJson(
    element: kotlinx.serialization.json.JsonElement,
): kotlinx.serialization.json.JsonElement = when (element) {
    is JsonObject -> JsonObject(
        element.entries
            .sortedBy { it.key }
            .associate { (key, value) -> key to canonicalizeSchemaJson(value) }
    )
    is kotlinx.serialization.json.JsonArray -> kotlinx.serialization.json.JsonArray(
        element.map(::canonicalizeSchemaJson)
    )
    else -> element
}

private fun ToolSchema.toSchema(): InputSchema {
    val properties = canonicalizeSchemaJson(
        this.properties ?: JsonObject(emptyMap())
    ) as JsonObject
    return InputSchema.Obj(
        properties = properties,
        required = this.required?.sorted(),
    )
}
'''
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpManager.kt
          git commit -m "perf: canonicalize MCP tool schemas"
          git rm .github/workflows/patch-canonical-mcp-schema.yml
          git commit -m "chore: remove temporary patch workflow"
          git push origin perf/canonical-mcp-schema
