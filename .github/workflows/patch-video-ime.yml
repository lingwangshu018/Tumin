name: Patch video call IME handling
on:
  push:
    branches: [fix/video-call-ime]
    paths:
      - .github/workflows/patch-video-ime.yml
      - .github/scripts/patch_video_ime.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-call-ime
      - name: Patch VideoCallPage
        run: python3 .github/scripts/patch_video_ime.py
      - name: Commit patch and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/voice/VideoCallPage.kt
          git commit -m "fix: keep video call controls above IME"
          git rm .github/workflows/patch-video-ime.yml .github/scripts/patch_video_ime.py
          git commit -m "chore: remove temporary video IME patch files"
          git push origin fix/video-call-ime
