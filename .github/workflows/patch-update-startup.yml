name: Patch update startup
on:
  push:
    branches:
      - feat/in-app-update-center
    paths:
      - '.github/workflows/patch-update-startup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/in-app-update-center
      - name: Patch RikkaHubApp
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt')
          s = p.read_text(encoding='utf-8-sig')
          old_import = 'import me.rerere.rikkahub.utils.DatabaseUtil\n'
          new_import = old_import + 'import me.rerere.rikkahub.utils.UpdateChecker\n'
          if 'import me.rerere.rikkahub.utils.UpdateChecker' not in s:
              if old_import not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(old_import, new_import, 1)
          call_anchor = '        // Increment launch count\n        incrementLaunchCount()\n'
          call_replacement = '        // Check GitHub Releases on launch when automatic updates are enabled (max once per day)\n        checkForUpdatesOnLaunch()\n\n' + call_anchor
          if 'checkForUpdatesOnLaunch()' not in s:
              if call_anchor not in s:
                  raise SystemExit('call anchor not found')
              s = s.replace(call_anchor, call_replacement, 1)
          fn_anchor = '    private fun incrementLaunchCount() {\n'
          fn = '''    private fun checkForUpdatesOnLaunch() {\n        get<AppScope>().launch {\n            runCatching {\n                get<UpdateChecker>().autoCheckIfDue(this@RikkaHubApp)\n            }.onFailure {\n                Log.w(TAG, "Automatic update check failed", it)\n            }\n        }\n    }\n\n'''
          if 'private fun checkForUpdatesOnLaunch()' not in s:
              if fn_anchor not in s:
                  raise SystemExit('function anchor not found')
              s = s.replace(fn_anchor, fn + fn_anchor, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-update-startup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt .github/workflows/patch-update-startup.yml
          git commit -m "feat: check for updates on app startup"
          git push
