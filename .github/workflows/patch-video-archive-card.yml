name: Patch video archive card

on:
  push:
    branches: [feat/video-call-record]
    paths:
      - ".github/workflows/patch-video-archive-card.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-call-record
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply narrow ChatMessage patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt')
          text = path.read_text(encoding='utf-8-sig')
          if 'VideoCallArchiveCard(sessionId = archiveSessionId)' in text:
              print('Patch already present; nothing to do.')
          else:
              start_marker = '                    is UIMessagePart.Text -> {'
              end_marker = '                    is UIMessagePart.Video -> {'
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]

              needle = '''                        SelectionContainer {\n'''
              replacement = '''                        val archiveSessionId = remember(part.text) {\n                            extractVideoCallArchiveSessionId(part.text)\n                        }\n\n                        if (archiveSessionId != null) {\n                            VideoCallArchiveCard(sessionId = archiveSessionId)\n                        } else {\n                            SelectionContainer {\n'''
              if needle not in block:
                  raise SystemExit('SelectionContainer insertion point not found')
              block = block.replace(needle, replacement, 1)

              close = '                    }\n \n'
              pos = block.rfind(close)
              if pos < 0:
                  raise SystemExit('Text block closing point not found')
              block = block[:pos] + '                        }\n' + block[pos:]
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/patch-video-archive-card.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit patched renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: render archived video calls as cards"
          git push origin HEAD:feat/video-call-record
