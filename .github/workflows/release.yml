name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          test -n "$KEY_BASE64" || { echo "KEY_BASE64 secret is missing"; exit 1; }
          test -n "$SIGNING_CONFIG" || { echo "SIGNING_CONFIG secret is missing"; exit 1; }
          printf '%s' "$KEY_BASE64" | base64 -d > app/app.key
          printf '%s' "$SIGNING_CONFIG" > local.properties

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/release/*.apk

      - name: Create or update GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          APK_GLOB="app/build/outputs/apk/release/*.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing APK asset(s)."
            gh release upload "$TAG" $APK_GLOB --clobber
          else
            gh release create "$TAG" \
              --title "Release ${{ steps.version.outputs.version }}" \
              --generate-notes \
              $APK_GLOB
          fi
