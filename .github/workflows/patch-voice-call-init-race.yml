name: Patch voice call init race

on:
  push:
    branches:
      - fix/voice-call-init-race-ci

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('app/src/main/java/me/rerere/rikkahub/service/VoiceCallService.kt')
          s = service.read_text(encoding='utf-8-sig')
          old = '''    val conversation: StateFlow<Conversation>\n        get() = chatService.getConversationFlow(conversationId)\n'''
          new = '''    val conversation: StateFlow<Conversation>\n        get() = chatService.getConversationFlow(conversationId)\n\n    /**\n     * Safe accessor for UI bindings that may connect before onStartCommand has initialized\n     * conversationId. Binding a started foreground service and receiving onStartCommand are\n     * separate lifecycle steps, so Compose can briefly receive the binder first.\n     */\n    fun getConversationFlowOrNull(): StateFlow<Conversation>? =\n        if (::conversationId.isInitialized) chatService.getConversationFlow(conversationId) else null\n'''
          if old not in s:
              raise SystemExit('VoiceCallService target not found')
          service.write_text(s.replace(old, new, 1), encoding='utf-8')

          voice = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/voice/VoiceCallPage.kt')
          s = voice.read_text(encoding='utf-8')
          old = '''    val conversationFlow = boundService?.conversation\n        ?.map { it as me.rerere.rikkahub.data.model.Conversation? }\n        ?: flowOf(null)\n'''
          new = '''    // The binder may arrive before VoiceCallService.onStartCommand initializes conversationId.\n    // Use the safe accessor during that short lifecycle window instead of touching lateinit state.\n    val conversationFlow = boundService?.getConversationFlowOrNull()\n        ?.map { it as me.rerere.rikkahub.data.model.Conversation? }\n        ?: flowOf(null)\n'''
          if old not in s:
              raise SystemExit('VoiceCallPage target not found')
          voice.write_text(s.replace(old, new, 1), encoding='utf-8')

          video = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/voice/VideoCallPage.kt')
          s = video.read_text(encoding='utf-8')
          old = '''    val conversationFlow = service?.conversation\n        ?.map { it as me.rerere.rikkahub.data.model.Conversation? }\n        ?: flowOf(null)\n'''
          new = '''    // bindService can deliver the binder before onStartCommand initializes conversationId.\n    val conversationFlow = service?.getConversationFlowOrNull()\n        ?.map { it as me.rerere.rikkahub.data.model.Conversation? }\n        ?: flowOf(null)\n'''
          if old not in s:
              raise SystemExit('VideoCallPage conversation target not found')
          s = s.replace(old, new, 1)

          old = '''        val activeService = service ?: return@LaunchedEffect\n        val current = conversation ?: return@LaunchedEffect\n        VideoCallArchiveRuntime.attach(\n'''
          new = '''        val activeService = service ?: return@LaunchedEffect\n        val current = conversation ?: return@LaunchedEffect\n        val activeConversationFlow = activeService.getConversationFlowOrNull() ?: return@LaunchedEffect\n        VideoCallArchiveRuntime.attach(\n'''
          if old not in s:
              raise SystemExit('VideoCallPage archive attach target not found')
          s = s.replace(old, new, 1)

          old = '''            conversationFlow = activeService.conversation,\n'''
          new = '''            conversationFlow = activeConversationFlow,\n'''
          if old not in s:
              raise SystemExit('VideoCallPage archive flow target not found')
          video.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile Android
        run: ./gradlew :app:compileReleaseKotlin --stacktrace
      - name: Remove temporary workflow and commit patch
        if: success()
        run: |
          rm .github/workflows/patch-voice-call-init-race.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/service/VoiceCallService.kt \
                  app/src/main/java/me/rerere/rikkahub/ui/pages/voice/VoiceCallPage.kt \
                  app/src/main/java/me/rerere/rikkahub/ui/pages/voice/VideoCallPage.kt \
                  .github/workflows/patch-voice-call-init-race.yml
          git commit -m "fix: guard voice call conversation initialization race"
          git push
