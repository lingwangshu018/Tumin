name: Patch stable tool definitions

on:
  push:
    branches:
      - perf/stable-tool-definitions
    paths:
      - .github/workflows/patch-stable-tools.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/stable-tool-definitions
      - name: Stabilize tool definitions
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/me/rerere/rikkahub/data/ai/tools/WorkspaceTools.kt')
          text = p.read_text(encoding='utf-8-sig')
          old1 = '''        if (!defaultCwd.isNullOrBlank()) {\n            append("Defaults to '$defaultCwd'. ")\n        }'''
          new1 = '''        if (!defaultCwd.isNullOrBlank()) {\n            append("Defaults to the active workspace directory. ")\n        }'''
          old2 = '''                        if (!defaultCwd.isNullOrBlank()) {\n                            "Working directory relative to the workspace files root. Defaults to '$defaultCwd'."\n                        } else {'''
          new2 = '''                        if (!defaultCwd.isNullOrBlank()) {\n                            "Working directory relative to the workspace files root. Defaults to the active workspace directory."\n                        } else {'''
          if old1 not in text or old2 not in text:
              raise SystemExit('WorkspaceTools cache-stability anchors not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('app/src/main/java/me/rerere/rikkahub/data/ai/tools/ToolSurfaceBuilder.kt')
          text = p.read_text(encoding='utf-8-sig')
          old = '''        }.distinctBy { it.name }\n    }\n}'''
          new = '''        }\n            .distinctBy { it.name }\n            .sortedBy { it.name }\n    }\n}'''
          if old not in text:
              raise SystemExit('ToolSurfaceBuilder anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/patch-stable-tools.yml
          git config user.name "lingwangshu018"
          git config user.email "307459419+lingwangshu018@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/data/ai/tools/WorkspaceTools.kt app/src/main/java/me/rerere/rikkahub/data/ai/tools/ToolSurfaceBuilder.kt .github/workflows/patch-stable-tools.yml
          git commit -m "perf: stabilize tool definitions for prompt caching"
          git push