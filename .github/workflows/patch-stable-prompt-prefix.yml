name: Patch stable prompt prefix

on:
  push:
    branches:
      - feat/stable-prompt-prefix
    paths:
      - .github/workflows/patch-stable-prompt-prefix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stable-prompt-prefix
      - name: Apply patch
        run: python3 .github/scripts/patch_stable_prompt_prefix.py
      - name: Commit patch
        run: |
          rm .github/workflows/patch-stable-prompt-prefix.yml
          rm .github/scripts/patch_stable_prompt_prefix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: keep dynamic memory out of system cache prefix"
          git push origin HEAD:feat/stable-prompt-prefix
