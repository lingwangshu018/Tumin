name: Format cache metrics block

on:
  push:
    branches: [feat/cache-hit-metrics]
    paths: [.github/workflows/format-cache-metrics.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-hit-metrics
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/stats/StatsPage.kt')
          s = p.read_text(encoding='utf-8')
          start = s.index('\nRow(\n    horizontalArrangement = Arrangement.spacedBy(8.dp),', s.index('private fun StatsGrid'))
          end = s.index('\n    }\n}\n\n@Composable\nprivate fun StatCard', start)
          block = '''
        Row(
            horizontalArrangement = Arrangement.spacedBy(8.dp),
            modifier = Modifier.fillMaxWidth(),
        ) {
            StatCard(
                modifier = Modifier.weight(1f),
                icon = HugeIcons.Zap,
                label = stringResource(R.string.stats_page_cache_hit_rate),
                value = formatPercent(stats.cacheHitRate),
            )
            StatCard(
                modifier = Modifier.weight(1f),
                icon = HugeIcons.Zap,
                label = stringResource(R.string.stats_page_cache_read_tokens),
                value = formatTokens(stats.totalCachedTokens.coerceAtLeast(0L)),
            )
        }
        StatCard(
            modifier = Modifier.fillMaxWidth(),
            icon = HugeIcons.Cpu,
            label = stringResource(R.string.stats_page_uncached_input_tokens),
            value = formatTokens(stats.uncachedPromptTokens),
        )
        StatCard(
            modifier = Modifier.fillMaxWidth(),
            icon = HugeIcons.Rocket01,
            label = stringResource(R.string.stats_page_launch_count),
            value = formatCount(stats.launchCount.toLong()),
        )'''
          p.write_text(s[:start] + '\n' + block.strip('\n') + s[end:], encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/format-cache-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/stats/StatsPage.kt .github/workflows/format-cache-metrics.yml
          git commit -m "style: format cache metrics cards"
          git push origin HEAD:feat/cache-hit-metrics
