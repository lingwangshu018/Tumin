name: Patch Rabbit Tool Chain
on:
  push:
    paths:
      - '.github/rabbit-tool-chain-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden GenerationHandler and ChatService
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- GenerationHandler ----------
          p = Path('app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt')
          s = p.read_text(encoding='utf-8-sig')

          old = '''        var messages: List<UIMessage> = messages.map { message ->
            message.copy(parts = message.parts.filterNot { part ->
                part is UIMessagePart.Tool && part.toolName.isBlank()
            })
        }.filterNot { it.parts.isEmpty() }
 
        for (stepIndex in 0 until maxSteps) {'''
          new = '''        var messages: List<UIMessage> = messages.map { message ->
            message.copy(parts = message.parts.filterNot { part ->
                part is UIMessagePart.Tool && (part.toolName.isBlank() || part.toolCallId.isBlank())
            })
        }.filterNot { it.parts.isEmpty() }

        val companionHardRouteToolNames = setOf(
            "read_couple_space",
            "post_couple_space",
            "comment_couple_space",
            "delete_couple_space_post",
            "shared_diary",
            "anniversary_book",
            "life_memo",
            "life_calendar",
            "shared_reading",
            "shared_music",
        )
        val companionHardRoute = tools.isNotEmpty() && tools.all { it.name in companionHardRouteToolNames }
 
        for (stepIndex in 0 until maxSteps) {'''
          if old not in s:
              raise SystemExit('GenerationHandler message sanitize anchor not found')
          s = s.replace(old, new, 1)

          old = '''            val toolsInternal = buildList {
                Log.i(TAG, "generateInternal: build tools($assistant)")
                // 文件写入工具 - AI可直接将文件内容写入设备或打包ZIP
                add(buildWriteFilesTool(conversationId))
                addAll(tools)
            }.distinctBy { it.name }'''
          new = '''            val toolsInternal = buildList {
                Log.i(TAG, "generateInternal: build tools($assistant), companionHardRoute=$companionHardRoute")
                // 生活模块 Hard Route 必须保持纯净，不能再混入文件/插件等无关工具。
                if (!companionHardRoute) {
                    add(buildWriteFilesTool(conversationId))
                }
                addAll(tools)
            }.distinctBy { it.name }'''
          if old not in s:
              raise SystemExit('GenerationHandler toolsInternal anchor not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              '                    pluginPromptInjections = pluginPromptInjections,\n',
              '                    pluginPromptInjections = if (companionHardRoute) emptyList() else pluginPromptInjections,\n',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # ---------- ChatService ----------
          p = Path('app/src/main/java/me/rerere/rikkahub/service/ChatService.kt')
          s = p.read_text(encoding='utf-8-sig')

          old = '''            // check invalid messages
            checkInvalidMessages(conversationId)
            val conversation = getConversationFlow(conversationId).value

            // start generating'''
          new = '''            // check invalid messages, including corrupt historical Tool parts.
            checkInvalidMessages(conversationId)
            val conversation = getConversationFlow(conversationId).value
            // Persist sanitization immediately so a corrupted Tool history does not return after restart.
            session.saveMutex.withLock {
                saveConversation(conversationId, conversation)
            }

            // start generating'''
          if old not in s:
              raise SystemExit('ChatService pre-generation sanitize anchor not found')
          s = s.replace(old, new, 1)

          old = '''        // 移除无效 tool (未执行的 Tool)
        messagesNodes = messagesNodes.mapIndexed { _, node ->
            // Check for Tool type with non-executed tools
            val hasPendingTools = node.currentMessage.getTools().any { !it.isExecuted }
'''
          new = '''        // 先清理已损坏的 Tool part：空 toolName/toolCallId 会让 Gemini function_response proto 直接失效。
        messagesNodes = messagesNodes.map { node ->
            val cleanedMessages = node.messages.map { msg ->
                msg.copy(parts = msg.parts.filterNot { part ->
                    part is UIMessagePart.Tool && (part.toolName.isBlank() || part.toolCallId.isBlank())
                })
            }.filterNot { it.parts.isEmpty() }
            val safeIndex = when {
                cleanedMessages.isEmpty() -> 0
                node.selectIndex in cleanedMessages.indices -> node.selectIndex
                else -> 0
            }
            node.copy(messages = cleanedMessages, selectIndex = safeIndex)
        }.filter { it.messages.isNotEmpty() }

        // 移除无效 tool (未执行的 Tool)
        messagesNodes = messagesNodes.mapIndexed { _, node ->
            // Check for Tool type with non-executed tools
            val hasPendingTools = node.currentMessage.getTools().any { !it.isExecuted }
'''
          if old not in s:
              raise SystemExit('ChatService invalid-tool anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt app/src/main/java/me/rerere/rikkahub/service/ChatService.kt
          git commit -m 'fix: harden Rabbit Space tool history and hard route'
          git push