name: Patch Generation Tool Surface V2
on:
  push:
    paths:
      - '.github/generation-tool-surface-trigger-v2'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden GenerationHandler and ChatService
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- GenerationHandler ----------
          p = Path('app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt')
          s = p.read_text(encoding='utf-8-sig')

          s = s.replace(
              'part is UIMessagePart.Tool && part.toolName.isBlank()',
              'part is UIMessagePart.Tool && (part.toolName.isBlank() || part.toolCallId.isBlank())',
              1,
          )

          anchor = '        }.filterNot { it.parts.isEmpty() }\n \n        for (stepIndex in 0 until maxSteps) {'
          if 'val companionHardRouteToolNames = setOf(' not in s:
              replacement = '''        }.filterNot { it.parts.isEmpty() }\n\n        val companionHardRouteToolNames = setOf(\n            "read_couple_space",\n            "post_couple_space",\n            "comment_couple_space",\n            "delete_couple_space_post",\n            "shared_diary",\n            "anniversary_book",\n            "life_memo",\n            "life_calendar",\n            "shared_reading",\n            "shared_music",\n        )\n        val companionHardRoute = tools.isNotEmpty() && tools.all { it.name in companionHardRouteToolNames }\n \n        for (stepIndex in 0 until maxSteps) {'''
              if anchor not in s:
                  raise SystemExit('GenerationHandler hard-route anchor not found')
              s = s.replace(anchor, replacement, 1)

          old = '''            val toolsInternal = buildList {\n                Log.i(TAG, "generateInternal: build tools($assistant)")\n                // 文件写入工具 - AI可直接将文件内容写入设备或打包ZIP\n                add(buildWriteFilesTool(conversationId))\n                addAll(tools)\n            }.distinctBy { it.name }'''
          new = '''            val toolsInternal = buildList {\n                Log.i(TAG, "generateInternal: build tools($assistant), companionHardRoute=$companionHardRoute")\n                // 生活模块 Hard Route 必须保持纯净，不再混入文件等无关工具。\n                if (!companionHardRoute) {\n                    add(buildWriteFilesTool(conversationId))\n                }\n                addAll(tools)\n            }.distinctBy { it.name }'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              '                    pluginPromptInjections = pluginPromptInjections,\n',
              '                    pluginPromptInjections = if (companionHardRoute) emptyList() else pluginPromptInjections,\n',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # ---------- ChatService ----------
          p = Path('app/src/main/java/me/rerere/rikkahub/service/ChatService.kt')
          s = p.read_text(encoding='utf-8-sig')

          old = '''            // check invalid messages\n            checkInvalidMessages(conversationId)\n            val conversation = getConversationFlow(conversationId).value\n\n            // start generating'''
          new = '''            // check invalid messages, including corrupt historical Tool parts.\n            checkInvalidMessages(conversationId)\n            val conversation = getConversationFlow(conversationId).value\n            // Persist sanitization immediately so corrupted tool history cannot return after restart.\n            session.saveMutex.withLock {\n                saveConversation(conversationId, conversation)\n            }\n\n            // start generating'''
          if old in s:
              s = s.replace(old, new, 1)

          marker = '''        // 移除无效 tool (未执行的 Tool)\n        messagesNodes = messagesNodes.mapIndexed { _, node ->'''
          if '空 toolName/toolCallId' not in s:
              replacement = '''        // 先清理已损坏的 Tool part：空 toolName/toolCallId 会让 Gemini function_response proto 直接失效。\n        messagesNodes = messagesNodes.map { node ->\n            val cleanedMessages = node.messages.map { msg ->\n                msg.copy(parts = msg.parts.filterNot { part ->\n                    part is UIMessagePart.Tool && (part.toolName.isBlank() || part.toolCallId.isBlank())\n                })\n            }.filterNot { it.parts.isEmpty() }\n            val safeIndex = when {\n                cleanedMessages.isEmpty() -> 0\n                node.selectIndex in cleanedMessages.indices -> node.selectIndex\n                else -> 0\n            }\n            node.copy(messages = cleanedMessages, selectIndex = safeIndex)\n        }.filter { it.messages.isNotEmpty() }\n\n        // 移除无效 tool (未执行的 Tool)\n        messagesNodes = messagesNodes.mapIndexed { _, node ->'''
              if marker not in s:
                  raise SystemExit('ChatService invalid-tool anchor not found')
              s = s.replace(marker, replacement, 1)

          # Remove dead branch: this code only runs when hasPendingTools is true, so allToolsExecuted can never be true.
          dead = '''\n                // If all tools are executed, it's valid\n                val allToolsExecuted = node.currentMessage.getTools().all { it.isExecuted }\n                if (allToolsExecuted && node.currentMessage.getTools().isNotEmpty()) {\n                    return@mapIndexed node\n                }\n'''
          s = s.replace(dead, '\n', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt app/src/main/java/me/rerere/rikkahub/service/ChatService.kt
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: harden Rabbit Space tool history and hard route'
          git push