name: Patch Generation Tool Surface V2
on:
  push:
    paths:
      - '.github/generation-tool-surface-trigger-v2'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GenerationHandler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt')
          s=p.read_text(encoding='utf-8-sig')

          # 1) Filter corrupt historical Tool parts with blank names before provider serialization.
          s=s.replace(
              '        var messages: List<UIMessage> = messages\n',
              '        var messages: List<UIMessage> = messages.map { message ->\n            message.copy(parts = message.parts.filterNot { part ->\n                part is UIMessagePart.Tool && part.toolName.isBlank()\n            })\n        }.filterNot { it.parts.isEmpty() }\n',
              1,
          )

          # 2) The incoming unified tool surface already owns memory registration. Remove the legacy duplicate memory injection here.
          start=s.find('                if (assistant?.enableMemory == true) {')
          if start == -1:
              start=s.find('                if (assistant.enableMemory == true) {')
          if start == -1:
              raise SystemExit('legacy memory block start not found')
          end=s.find('                // 文件写入工具', start)
          if end == -1:
              raise SystemExit('legacy memory block end not found')
          s=s[:start] + s[end:]

          # 3) Final safety net: no provider-visible duplicate tool names.
          s=s.replace(
              '                addAll(tools)\n            }\n',
              '                addAll(tools)\n            }.distinctBy { it.name }\n',
              1,
          )

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          git commit -m 'fix: remove duplicate memory injection and sanitize tool history'
          git push