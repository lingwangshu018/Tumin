name: Patch cache hit metrics

on:
  push:
    branches:
      - feat/cache-hit-metrics
    paths:
      - .github/workflows/patch-cache-hit-metrics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-hit-metrics
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply cache metrics patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          vm_path = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/stats/StatsVM.kt')
          vm = vm_path.read_text(encoding='utf-8-sig')
          old = """data class AppStats(
              val isLoading: Boolean = true,
              val totalConversations: Int = 0,
              val totalMessages: Int = 0,
              val totalPromptTokens: Long = 0L,
              val totalCompletionTokens: Long = 0L,
              val totalCachedTokens: Long = 0L,
              val conversationsPerDay: Map<LocalDate, Int> = emptyMap(),
              val launchCount: Int = 0,
          )"""
          new = """data class AppStats(
              val isLoading: Boolean = true,
              val totalConversations: Int = 0,
              val totalMessages: Int = 0,
              val totalPromptTokens: Long = 0L,
              val totalCompletionTokens: Long = 0L,
              val totalCachedTokens: Long = 0L,
              val conversationsPerDay: Map<LocalDate, Int> = emptyMap(),
              val launchCount: Int = 0,
          ) {
              private val boundedCachedTokens: Long
                  get() = totalCachedTokens.coerceIn(0L, totalPromptTokens.coerceAtLeast(0L))

              val cacheHitRate: Double
                  get() = if (totalPromptTokens > 0L) {
                      boundedCachedTokens.toDouble() / totalPromptTokens.toDouble()
                  } else {
                      0.0
                  }

              val uncachedPromptTokens: Long
                  get() = (totalPromptTokens.coerceAtLeast(0L) - boundedCachedTokens).coerceAtLeast(0L)
          }"""
          if old not in vm:
              raise SystemExit('AppStats anchor not found')
          vm_path.write_text(vm.replace(old, new, 1), encoding='utf-8')

          page_path = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/stats/StatsPage.kt')
          page = page_path.read_text(encoding='utf-8-sig')
          pattern = re.compile(
              r'\n\s*if \(stats\.totalCachedTokens > 0\) \{\s*'
              r'StatCard\(\s*modifier = Modifier\.fillMaxWidth\(\),\s*'
              r'icon = HugeIcons\.Zap,\s*'
              r'label = stringResource\(R\.string\.stats_page_cached_tokens\),\s*'
              r'value = formatTokens\(stats\.totalCachedTokens\),\s*\)\s*\}\s*'
          )
          replacement = """
          Row(
              horizontalArrangement = Arrangement.spacedBy(8.dp),
              modifier = Modifier.fillMaxWidth(),
          ) {
              StatCard(
                  modifier = Modifier.weight(1f),
                  icon = HugeIcons.Zap,
                  label = stringResource(R.string.stats_page_cache_hit_rate),
                  value = formatPercent(stats.cacheHitRate),
              )
              StatCard(
                  modifier = Modifier.weight(1f),
                  icon = HugeIcons.Zap,
                  label = stringResource(R.string.stats_page_cache_read_tokens),
                  value = formatTokens(stats.totalCachedTokens.coerceAtLeast(0L)),
              )
          }
          StatCard(
              modifier = Modifier.fillMaxWidth(),
              icon = HugeIcons.Cpu,
              label = stringResource(R.string.stats_page_uncached_input_tokens),
              value = formatTokens(stats.uncachedPromptTokens),
          )
          """
          page, count = pattern.subn('\n' + replacement.strip('\n') + '\n', page, count=1)
          if count != 1:
              raise SystemExit(f'StatsPage cache-card match count={count}')
          anchor = 'private fun formatTokens(count: Long): String = when {'
          helper = 'private fun formatPercent(rate: Double): String = "%.1f%%".format(rate.coerceIn(0.0, 1.0) * 100.0)\n\n'
          if anchor not in page:
              raise SystemExit('formatTokens anchor not found')
          page = page.replace(anchor, helper + anchor, 1)
          page_path.write_text(page, encoding='utf-8')

          translations = {
              Path('app/src/main/res/values/strings.xml'): {
                  'stats_page_cache_hit_rate': 'Cache hit rate',
                  'stats_page_cache_read_tokens': 'Cache read tokens',
                  'stats_page_uncached_input_tokens': 'Uncached input tokens',
              },
              Path('app/src/main/res/values-zh/strings.xml'): {
                  'stats_page_cache_hit_rate': '缓存命中率',
                  'stats_page_cache_read_tokens': '缓存读取 Token',
                  'stats_page_uncached_input_tokens': '未缓存输入 Token',
              },
              Path('app/src/main/res/values-zh-rTW/strings.xml'): {
                  'stats_page_cache_hit_rate': '快取命中率',
                  'stats_page_cache_read_tokens': '快取讀取 Token',
                  'stats_page_uncached_input_tokens': '未快取輸入 Token',
              },
          }
          for path, entries in translations.items():
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8-sig')
              additions = [
                  f'    <string name="{key}">{value}</string>'
                  for key, value in entries.items()
                  if f'name="{key}"' not in text
              ]
              if additions:
                  if '</resources>' not in text:
                      raise SystemExit(f'resources closing tag not found: {path}')
                  text = text.replace('</resources>', '\n' + '\n'.join(additions) + '\n</resources>', 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-cache-hit-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/stats/StatsVM.kt \
                  app/src/main/java/me/rerere/rikkahub/ui/pages/stats/StatsPage.kt \
                  app/src/main/res/values/strings.xml \
                  app/src/main/res/values-zh/strings.xml \
                  app/src/main/res/values-zh-rTW/strings.xml \
                  .github/workflows/patch-cache-hit-metrics.yml
          git commit -m "feat: expose prompt cache hit metrics"
          git push origin HEAD:feat/cache-hit-metrics
