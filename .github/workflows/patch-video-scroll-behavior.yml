name: Patch video scroll behavior
on:
  push:
    branches: [fix/video-call-ime]
    paths: [.github/workflows/patch-video-scroll-behavior.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-call-ime
      - name: Apply patch
        run: python3 .github/scripts/patch_video_scroll_behavior.py
      - name: Commit patch and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/voice/VideoCallPage.kt
          git commit -m "fix: preserve manual video call scroll position"
          git rm .github/scripts/patch_video_scroll_behavior.py .github/workflows/patch-video-scroll-behavior.yml
          git commit -m "chore: remove temporary video scroll patch"
          git push origin fix/video-call-ime
