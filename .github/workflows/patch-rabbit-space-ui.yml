name: Patch Rabbit Space UI

on:
  push:
    paths:
      - '.github/rabbit-space-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rabbit space UI and tool registration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/couple/CouplePages.kt')
          s = page.read_text(encoding='utf-8-sig')

          replacements = [
              ('绑定后，QQ空间、我们的日记和纪念日都会属于你们两个人。', '绑定后，兔眠空间、我们的日记和纪念日都会属于你们两个人。'),
              ('FeatureCard("⭐", "QQ空间", "逛逛你和 $partnerName 各自的动态、照片与留言")', 'FeatureCard("🌙", "兔眠空间", "逛逛你和 $partnerName 各自的动态、照片与留言")'),
              ('topBar = { TopAppBar(title = { Text("我们的空间") }, navigationIcon = { BackButton() }) }', 'topBar = { TopAppBar(title = { Text("兔眠空间") }, navigationIcon = { BackButton() }) }'),
              ('Text("⭐ 我们的 QQ 空间", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)', 'Text("🌙 兔眠空间", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected UI text: {old}')
              s = s.replace(old, new)

          old = '''    val settings by vm.settings.collectAsStateWithLifecycle()\n    val context = LocalContext.current'''
          new = '''    val settings by vm.settings.collectAsStateWithLifecycle()\n    val rabbitSpaceUiState by vm.rabbitSpaceUiState.collectAsStateWithLifecycle()\n    val context = LocalContext.current'''
          if old not in s:
              raise SystemExit('Missing rabbitSpaceUiState insertion point')
          s = s.replace(old, new, 1)

          old = '''                            OutlinedButton(onClick = { vm.maybeCreateAiPost(force = true) }) { Text("让 $partnerName 发一条") }'''
          new = '''                            OutlinedButton(\n                                enabled = !rabbitSpaceUiState.generatingPost,\n                                onClick = { vm.maybeCreateAiPost(force = true) },\n                            ) {\n                                Text(if (rabbitSpaceUiState.generatingPost) "$partnerName 正在想……" else "让 $partnerName 发一条")\n                            }'''
          if old not in s:
              raise SystemExit('Missing AI post button')
          s = s.replace(old, new, 1)

          hero_end = '''                    }\n                }\n            }\n            item {\n                Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {'''
          feedback = '''                    }\n                }\n            }\n            if (rabbitSpaceUiState.notice != null || rabbitSpaceUiState.error != null) {\n                item {\n                    Surface(\n                        modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp),\n                        shape = RoundedCornerShape(14.dp),\n                        color = if (rabbitSpaceUiState.error != null) MaterialTheme.colorScheme.errorContainer else MaterialTheme.colorScheme.secondaryContainer,\n                    ) {\n                        Row(\n                            modifier = Modifier.fillMaxWidth().padding(12.dp),\n                            verticalAlignment = Alignment.CenterVertically,\n                            horizontalArrangement = Arrangement.spacedBy(8.dp),\n                        ) {\n                            Text(\n                                rabbitSpaceUiState.error ?: rabbitSpaceUiState.notice.orEmpty(),\n                                modifier = Modifier.weight(1f),\n                                color = if (rabbitSpaceUiState.error != null) MaterialTheme.colorScheme.onErrorContainer else MaterialTheme.colorScheme.onSecondaryContainer,\n                            )\n                            TextButton(onClick = vm::clearRabbitSpaceFeedback) { Text("知道了") }\n                        }\n                    }\n                }\n            }\n            item {\n                Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {'''
          if hero_end not in s:
              raise SystemExit('Missing feedback insertion point')
          s = s.replace(hero_end, feedback, 1)

          old = '''                    onLike = { vm.toggleLike(post) },\n                    onComment = { vm.addUserComment(post, it) },\n                )'''
          new = '''                    onLike = { vm.toggleLike(post) },\n                    onComment = { vm.addUserComment(post, it) },\n                    onDelete = { vm.deletePost(post) },\n                )'''
          if old not in s:
              raise SystemExit('Missing MomentCard call')
          s = s.replace(old, new, 1)

          old = '''    onLike: () -> Unit,\n    onComment: (String) -> Unit,\n) {'''
          new = '''    onLike: () -> Unit,\n    onComment: (String) -> Unit,\n    onDelete: () -> Unit,\n) {'''
          if old not in s:
              raise SystemExit('Missing MomentCard signature')
          s = s.replace(old, new, 1)

          old = '''    var commentDraft by remember(post.id) { mutableStateOf("") }\n\n    Card'''
          new = '''    var commentDraft by remember(post.id) { mutableStateOf("") }\n    var confirmDelete by remember(post.id) { mutableStateOf(false) }\n\n    Card'''
          if old not in s:
              raise SystemExit('Missing delete state insertion point')
          s = s.replace(old, new, 1)

          old = '''                TextButton(onClick = onLike) { Text(if (post.liked) "♡ 已喜欢" else "♡ 喜欢") }\n                TextButton(onClick = { }) { Text("💬 ${postComments.size}") }'''
          new = '''                TextButton(onClick = { confirmDelete = true }) { Text("删除") }\n                TextButton(onClick = onLike) { Text(if (post.liked) "♡ 已喜欢" else "♡ 喜欢") }\n                TextButton(onClick = { }) { Text("💬 ${postComments.size}") }'''
          if old not in s:
              raise SystemExit('Missing action row')
          s = s.replace(old, new, 1)

          old = '''            }\n        }\n    }\n}\n\n@Composable\nprivate fun PostImageGrid'''
          new = '''            }\n        }\n    }\n\n    if (confirmDelete) {\n        AlertDialog(\n            onDismissRequest = { confirmDelete = false },\n            title = { Text("删除这条动态？") },\n            text = { Text("动态和它下面的评论都会一起删除，这个操作不能撤销。") },\n            confirmButton = {\n                TextButton(onClick = {\n                    confirmDelete = false\n                    onDelete()\n                }) { Text("删除") }\n            },\n            dismissButton = { TextButton(onClick = { confirmDelete = false }) { Text("取消") } },\n        )\n    }\n}\n\n@Composable\nprivate fun PostImageGrid'''
          if old not in s:
              raise SystemExit('Missing delete dialog insertion point')
          s = s.replace(old, new, 1)

          page.write_text(s, encoding='utf-8')

          tools = Path('app/src/main/java/me/rerere/rikkahub/data/ai/tools/ToolSurfaceBuilder.kt')
          t = tools.read_text(encoding='utf-8-sig')
          needle = '''                    add(commentCoupleSpaceTool(coupleRepository, invocationContext))'''
          replacement = needle + '''\n                    add(deleteCoupleSpacePostTool(coupleRepository, invocationContext))'''
          count = t.count(needle)
          if count < 2:
              raise SystemExit(f'Expected at least 2 couple-space registration points, got {count}')
          t = t.replace(needle, replacement)
          tools.write_text(t, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "orangechat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/couple/CouplePages.kt app/src/main/java/me/rerere/rikkahub/data/ai/tools/ToolSurfaceBuilder.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: finish Rabbit Space UI and delete flow"
          git push
