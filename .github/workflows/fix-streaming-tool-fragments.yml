name: Fix Streaming Tool Fragments

on:
  push:
    paths:
      - '.github/fix-streaming-tool-fragments-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic repair
        run: python3 .github/scripts/fix_streaming_tool_fragments.py

      - name: Commit repaired sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai/src/main/java/me/rerere/ai/ui/Message.kt app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          if git diff --cached --quiet; then
            echo 'No source changes needed'
          else
            git commit -m 'fix: merge fragmented tool calls before provider round-trip'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Validate AI module and app compile
        run: ./gradlew :ai:testDebugUnitTest :app:compileDebugKotlin --no-daemon
