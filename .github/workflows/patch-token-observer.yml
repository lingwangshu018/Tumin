name: Patch Token Observer

on:
  push:
    paths:
      - '.github/token-observer-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add non-invasive token observation logs
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt"); s=p.read_text(encoding="utf-8-sig"); a="        var messages: List<UIMessage> = messages\n        val params = TextGenerationParams(\n"; i="        // Token observation only: measure payload shape without changing chat behavior.\n        val limitedHistoryForObservation = messages.limitContext(assistant.contextMessageSize)\n        val systemCharsForObservation = internalMessages.firstOrNull { it.role == MessageRole.SYSTEM }?.toText()?.length ?: 0\n        val historyCharsForObservation = limitedHistoryForObservation.sumOf { it.toText().length }\n        val pluginPromptCharsForObservation = pluginPromptInjections.sumOf { it.length }\n        val externalMemoryConfigCountForObservation = settings.externalMemories.count { it.enabled && it.id in assistant.externalMemoryIds }\n        Log.i(\"TokenObserver\", \"model=${model.id}, systemChars=$systemCharsForObservation, historyMessages=${limitedHistoryForObservation.size}, historyChars=$historyCharsForObservation, memoryItems=${if (assistant.enableMemory) memories.size else 0}, tools=${tools.size}, pluginPrompts=${pluginPromptInjections.size}, pluginPromptChars=$pluginPromptCharsForObservation, recentChats=${assistant.enableRecentChatsReference}, externalMemoryConfigs=$externalMemoryConfigCountForObservation, contextMessageSize=${assistant.contextMessageSize}\")\n\n"+a; assert ("TokenObserver" in s) or (a in s), "expected anchor not found"; p.write_text(s if "TokenObserver" in s else s.replace(a,i,1), encoding="utf-8")'

      - name: Commit observer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          if git diff --cached --quiet; then
            echo 'No source changes needed'
          else
            git commit -m 'chore: add non-invasive token usage observer'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
